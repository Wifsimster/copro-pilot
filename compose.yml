services:
  postgres:
    image: postgres:16-alpine
    container_name: immo-ia-postgres
    environment:
      POSTGRES_USER: immo_ia
      POSTGRES_PASSWORD: password
      POSTGRES_DB: immo_ia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
