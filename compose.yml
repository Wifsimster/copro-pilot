services:
  postgres:
    image: postgres:18-alpine
    container_name: copro-pilot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  copro-pilot:
    image: wifsimster/copro-pilot:latest
    container_name: copro-pilot
    env_file:
      - .env
    ports:
      - "3000:3001"
    environment:
      NODE_ENV: production
      POSTGRES_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@copro-pilot-postgres:5432/${POSTGRES_DB}
      BASE_URL: ${BASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
