services:
  postgres:
    image: postgres:16-alpine
    container_name: copro-pilot-postgres
    environment:
      POSTGRES_USER: copro_pilot
      POSTGRES_PASSWORD: password
      POSTGRES_DB: copro_pilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
