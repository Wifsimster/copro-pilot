services:
  postgres:
    image: postgres:18-alpine
    container_name: copro-pilot-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-copro_pilot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-copro_pilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-copro_pilot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  copro-pilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: copro-pilot-app
    env_file:
      - .env
    ports:
      - "3000:3001"
    environment:
      - NODE_ENV=development
      - POSTGRES_URI=postgresql://${POSTGRES_USER:-copro_pilot}:${POSTGRES_PASSWORD:-password}@copro-pilot-postgres:5432/${POSTGRES_DB:-copro_pilot}
      - BASE_URL=${BASE_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
