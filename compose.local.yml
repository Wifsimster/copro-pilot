services:
  postgres:
    image: postgres:18-alpine
    container_name: immo-ia-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-immo_ia}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-immo_ia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-immo_ia}"]
      interval: 10s
      timeout: 5s
      retries: 5

  immo-ia:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: immo-ia-app
    env_file:
      - .env
    ports:
      - "3000:3001"
    environment:
      - NODE_ENV=development
      - POSTGRES_URI=postgresql://${POSTGRES_USER:-immo_ia}:${POSTGRES_PASSWORD:-password}@immo-ia-postgres:5432/${POSTGRES_DB:-immo_ia}
      - BASE_URL=${BASE_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
