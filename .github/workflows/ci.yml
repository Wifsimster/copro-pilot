name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --workspaces --include-workspace-root

      - name: Security audit
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

      - name: Lint backend
        run: npm run lint --workspace=@copro-pilot/backend

      - name: Lint frontend
        run: npm run lint --workspace=copro-pilot-frontend

      - name: TypeScript check
        run: npm run typecheck --workspace=copro-pilot-frontend

      - name: Test backend
        run: npm test --workspace=@copro-pilot/backend -- --coverage

      - name: Test frontend
        run: npm test --workspace=copro-pilot-frontend -- --coverage

      - name: Build frontend
        run: npm run build --workspace=copro-pilot-frontend

  e2e:
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 20

    env:
      NODE_ENV: development
      PORT: 3001
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: copro_pilot
      POSTGRES_USER: copro_pilot
      POSTGRES_PASSWORD: copro_pilot
      BETTER_AUTH_SECRET: e2e-test-secret-key-not-for-production
      BASE_URL: http://localhost:3001

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: copro_pilot
          POSTGRES_USER: copro_pilot
          POSTGRES_PASSWORD: copro_pilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --workspaces --include-workspace-root

      - name: Create backend .env file
        run: env | grep -E '^(NODE_ENV|PORT|POSTGRES_|BETTER_AUTH_SECRET|BASE_URL)=' > apps/backend/.env

      - name: Run migrations and seeds
        run: |
          cd apps/backend
          npm run migrate:latest
          npm run seed:run

      - name: Build frontend
        run: npm run build --workspace=copro-pilot-frontend

      - name: Stage frontend bundle for backend SPA serving
        run: ln -s "$GITHUB_WORKSPACE/apps/frontend/dist" "$GITHUB_WORKSPACE/frontend-dist"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start backend (serves API + SPA on 3001)
        run: node --env-file=apps/backend/.env apps/backend/src/index.js > backend.log 2>&1 &

      - name: Wait for server
        run: npx wait-on --timeout 30000 http://localhost:3001/api/health http://localhost:3001/

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3001

      - name: Upload backend log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend.log
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: [ci, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      new-release-published: ${{ steps.semantic.outputs.new_release_published }}
      new-release-version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --workspaces --include-workspace-root

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new-release-published == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest changes (version bump commit)
        run: git pull origin main

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:latest
            ghcr.io/${{ steps.repo.outputs.name }}:${{ needs.release.outputs.new-release-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    needs: [docker]
    steps:
      - name: Deploy
        run: /home/deploy/deploy-copro-pilot.sh
