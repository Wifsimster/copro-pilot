name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --workspaces --include-workspace-root

      - name: Lint backend
        run: npm run lint --workspace=@copro-pilot/backend

      - name: Lint frontend
        run: npm run lint --workspace=copro-pilot-frontend

      - name: TypeScript check
        run: npm run typecheck --workspace=copro-pilot-frontend

      - name: Build frontend
        run: npm run build --workspace=copro-pilot-frontend

  release:
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      new-release-published: ${{ steps.semantic.outputs.new_release_published }}
      new-release-version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --workspaces --include-workspace-root

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new-release-published == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest changes (version bump commit)
        run: git pull origin main

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: wifsimster
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            wifsimster/copro-pilot:latest
            wifsimster/copro-pilot:${{ needs.release.outputs.new-release-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
