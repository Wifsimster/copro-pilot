name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --workspaces --include-workspace-root

      - name: Lint backend
        run: npm run lint --workspace=@copro-pilot/backend

      - name: Lint frontend
        run: npm run lint --workspace=copro-pilot-frontend

      - name: TypeScript check
        run: npm run typecheck --workspace=copro-pilot-frontend

      - name: Build frontend
        run: npm run build --workspace=copro-pilot-frontend

  docker:
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: wifsimster
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            wifsimster/copro-pilot:latest
            wifsimster/copro-pilot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
