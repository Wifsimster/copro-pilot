name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --workspaces --include-workspace-root

      - name: Lint backend
        run: npm run lint --workspace=@copro-pilot/backend

      - name: Lint frontend
        run: npm run lint --workspace=copro-pilot-frontend

      - name: TypeScript check
        run: npm run typecheck --workspace=copro-pilot-frontend

      - name: Build frontend
        run: npm run build --workspace=copro-pilot-frontend
